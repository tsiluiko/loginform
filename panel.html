<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель реєстрації</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <form id="registrationForm" class="form" novalidate>
            <fieldset>
                <legend>Реєстрація користувача</legend>

                <div class="form-group">
                    <label for="firstName">Ім'я:</label>
                    <input type="text" id="firstName" name="firstName" autocomplete="given-name">
                    <span class="error" id="firstNameError"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">Прізвище:</label>
                    <input type="text" id="lastName" name="lastName" autocomplete="family-name">
                    <span class="error" id="lastNameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Електронна пошта:</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="example@example.com">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password" autocomplete="new-password">
                    <span class="error" id="passwordError"></span>
                    <ul class="password-rules" id="passwordRules">
                        <li data-rule="minLength">мінімум 8 символів</li>
                        <li data-rule="uppercase">велика літера</li>
                        <li data-rule="lowercase">маленька літера</li>
                        <li data-rule="number">цифра</li>
                        <li data-rule="specialCharacter">спецсимвол (!@#$%^&amp;*)</li>
                    </ul>
                </div>

                <label class="checkbox">
                    <input type="checkbox" id="showPassword">
                    Показати пароль
                </label>
            </fieldset>

            <button type="submit" id="submitBtn" disabled>Надіслати</button>
            <div class="success" id="successMessage" hidden></div>
        </form>
    </main>

    <script src="js/validation.js"></script>
    <script src="js/ValidationPage.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
